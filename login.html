<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accedi ad Alpha</title>
  <link rel="icon" type="image/png" href="alpha-icon-only.png">
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <div class="login-container">
    <img src="alpha-icon-only.png" alt="Alpha Logo" class="login-logo">
    
    <h1 class="login-title">Accedi ad Alpha</h1>
    <p class="login-subtitle">Area riservata al team HR</p>

    <form id="login-form" class="login-form">
      <div class="input-group" id="group-email">
        <label for="email">Indirizzo email</label>
        <input type="email" id="email" name="email" placeholder="nome@azienda.com" required>
      </div>

      <div class="input-group" id="group-code" style="display: none;">
        <label for="code">Codice di accesso</label>
        <input type="text" id="code" name="code" placeholder="Es. 123456" autocomplete="one-time-code">
      </div>
      
      <button type="submit" id="submit-btn" class="login-btn">Invia codice</button>
      
      <div id="error-msg" class="error-message">Errore. Riprova.</div>
    </form>

    <div class="footer-text">
      &copy; 2026 Alpha
    </div>
  </div>

  <script>
    let step = 1;

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value.trim();
      const code = document.getElementById('code').value.trim();
      const btn = document.getElementById('submit-btn');
      const err = document.getElementById('error-msg');
      
      btn.disabled = true;
      err.classList.remove('visible');

      if (step === 1) {
        btn.textContent = 'Invio in corso...';
        try {
          const res = await fetch('/api/login/request-code', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
          });

          if (res.ok) {
            step = 2;
            document.getElementById('group-email').style.display = 'none';
            document.getElementById('group-code').style.display = 'flex';
            document.getElementById('code').required = true;
            btn.textContent = 'Accedi';
            btn.disabled = false;
          } else {
            err.textContent = 'Email non autorizzata.';
            err.classList.add('visible');
            btn.disabled = false;
            btn.textContent = 'Invia codice';
          }
        } catch (error) {
          err.textContent = 'Errore di connessione al server.';
          err.classList.add('visible');
          btn.disabled = false;
          btn.textContent = 'Invia codice';
        }
      } else {
        btn.textContent = 'Accesso in corso...';
        try {
          const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, code })
          });

          if (res.ok) {
            window.location.href = '/dashboard';
          } else {
            err.textContent = 'Codice errato o scaduto.';
            err.classList.add('visible');
            btn.disabled = false;
            btn.textContent = 'Accedi';
            document.getElementById('code').value = '';
          }
        } catch (error) {
          err.textContent = 'Errore di connessione al server.';
          err.classList.add('visible');
          btn.disabled = false;
          btn.textContent = 'Accedi';
        }
      }
    });
  </script>
</body>
</html>
